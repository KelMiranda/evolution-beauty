name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Cache installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
          key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}

      - name: Install dependencies (Astro backend)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install app dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: app

      - name: Run backend Vitest
        run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Run React Vitest
        run: npm run test:unit
        working-directory: app
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test]
    # The first hosted run may cold-pull PostgreSQL. The service healthcheck,
    # explicit wait step, and Playwright's two CI retries mitigate startup flakes.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acoes
          POSTGRES_PASSWORD: acoes
          POSTGRES_DB: acoes_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acoes -d acoes_local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Disposable CI credentials intentionally mirror docker-compose; they are
    # not production secrets and the service is isolated to this job.
    env:
      DATABASE_URL: postgres://acoes:acoes@localhost:5432/acoes_local
      POSTGRES_PASSWORD: acoes
      INITIAL_ADMIN_EMAIL: admin@acoes.local
      INITIAL_ADMIN_PASSWORD: Admin1234!

    steps:
      - name: Require database CI configuration
        shell: bash
        run: |
          for required in DATABASE_URL POSTGRES_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing secret or CI variable: ${required}"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
          key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}

      - name: Install dependencies (Astro backend)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install app dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: app

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: app

      - name: Build React app
        run: npm run build
        working-directory: app
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Stage React app for Astro
        run: cp -R app/dist/. public/

      - name: Astro type-check
        # Run `astro check` in its own process so the type-checker heap
        # (which can spike to ~4 GB on a project this size) is reclaimed
        # before `astro build` starts. Running both in the same shell
        # (`astro check && astro build`) shares a single process and
        # doubles the peak, which is what was hitting OOM at 6 GB.
        run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Astro build
        run: npm run astro -- build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          if ! npx --yes wait-on@8.0.3 tcp:127.0.0.1:5432 --timeout 60000; then
            echo "::error::database unavailable after 60 seconds"
            exit 1
          fi

      - name: Start Astro backend
        shell: bash
        run: |
          nohup npm start > /tmp/acoes-backend.log 2>&1 &
          echo $! > /tmp/acoes-backend.pid

      - name: Verify Astro backend process
        shell: bash
        run: |
          if ! kill -0 "$(cat /tmp/acoes-backend.pid)" 2>/dev/null; then
            echo "::error::Astro backend process exited before readiness checks"
            cat /tmp/acoes-backend.log
            exit 1
          fi

      - name: Wait for Astro backend
        shell: bash
        run: |
          if ! npx --yes wait-on@8.0.3 tcp:127.0.0.1:4321 --timeout 180000; then
            echo "::error::Backend port did not open in time"
            cat /tmp/acoes-backend.log
            exit 1
          fi

          if ! npx --yes wait-on@8.0.3 http-get://127.0.0.1:4321/api/health --timeout 180000; then
            echo "::error::Backend health endpoint did not respond in time"
            cat /tmp/acoes-backend.log
            exit 1
          fi

      # Playwright targets the unified Astro server, which serves both the
      # staged SPA build and API from port 4321.
      - name: Run Playwright E2E
        run: npx playwright test
        working-directory: app
        env:
          CI: 'true'

      - name: Dump backend log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/acoes-backend.log ]; then
            cat /tmp/acoes-backend.log
          fi

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Cache installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
          key: ${{ runner.os }}-node-24-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}

      - name: Install dependencies (Astro backend)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install app dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: app

      - name: Type check (Astro)
        run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Build Astro
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      
      - name: Type check (React app)
        run: npx tsc --noEmit
        working-directory: app
