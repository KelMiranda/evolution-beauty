name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Cache installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}

      - name: Install dependencies (Astro backend)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install app dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: app

      - name: Run backend Vitest
        run: npm test

      - name: Run React Vitest
        run: npm run test:unit
        working-directory: app

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test]
    # The first hosted run may cold-pull PostgreSQL. The service healthcheck,
    # explicit wait step, and Playwright's two CI retries mitigate startup flakes.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acoes
          POSTGRES_PASSWORD: acoes
          POSTGRES_DB: acoes_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acoes -d acoes_local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Disposable CI credentials intentionally mirror docker-compose; they are
    # not production secrets and the service is isolated to this job.
    env:
      DATABASE_URL: postgres://acoes:acoes@localhost:5432/acoes_local
      POSTGRES_PASSWORD: acoes
      INITIAL_ADMIN_EMAIL: admin@acoes.local
      INITIAL_ADMIN_PASSWORD: Admin1234!

    steps:
      - name: Require database CI configuration
        shell: bash
        run: |
          for required in DATABASE_URL POSTGRES_PASSWORD; do
            if [ -z "${!required:-}" ]; then
              echo "::error::Missing secret or CI variable: ${required}"
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Restore installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}

      - name: Install dependencies (Astro backend)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install app dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: app

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
        working-directory: app

      - name: Build React app
        run: npm run build
        working-directory: app

      - name: Stage React app for Astro
        run: cp -R app/dist/. public/

      - name: Build Astro server
        run: npm run build

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          if ! npx --yes wait-on@8.0.3 tcp:127.0.0.1:5432 --timeout 60000; then
            echo "::error::database unavailable after 60 seconds"
            exit 1
          fi

      - name: Start Astro backend
        run: npm start > /tmp/acoes-backend.log 2>&1 &

      - name: Wait for Astro backend
        shell: bash
        run: |
          if ! npx --yes wait-on@8.0.3 http-get://127.0.0.1:4321/api/courses --timeout 60000; then
            echo "::error::Backend unavailable; database startup may have failed"
            cat /tmp/acoes-backend.log
            exit 1
          fi

      # Playwright targets the unified Astro server, which serves both the
      # staged SPA build and API from port 4321.
      - name: Run Playwright E2E
        run: npx playwright test
        working-directory: app
        env:
          CI: 'true'

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Cache installed dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
          key: ${{ runner.os }}-node-20-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}

      - name: Install dependencies (Astro backend)
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install app dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: app

      - name: Type check (Astro)
        run: npm run build

      - name: Type check (React app)
        run: npx tsc --noEmit
        working-directory: app
