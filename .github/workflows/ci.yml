name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Astro backend)
        run: npm ci

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Run Vitest
        run: npm run test:unit --if-present
        working-directory: app

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (Astro backend)
        run: npm ci

      - name: Install app dependencies
        run: npm ci
        working-directory: app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        working-directory: app

      - name: Start dev servers
        run: |
          npm run dev &
          cd app && npm run dev &
          sleep 10

      - name: Run Playwright E2E
        run: npx playwright test
        working-directory: app

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check (Astro)
        run: npm run build

      - name: Type check (React app)
        run: npx tsc --noEmit
        working-directory: app
