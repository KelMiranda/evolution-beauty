services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acoes_local
      POSTGRES_USER: acoes
      POSTGRES_PASSWORD: acoes
    ports:
      - '5437:5432'
    volumes:
      - acoes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acoes -d acoes_local']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://acoes:acoes@db:5432/acoes_local
      NODE_ENV: production
      COOKIE_SECURE: 'false'
      PORT: 4321
      HOST: 0.0.0.0
      PUBLIC_SITE_URL: http://localhost:4321
      INITIAL_ADMIN_EMAIL: admin@acoes.local
      INITIAL_ADMIN_PASSWORD: Admin1234!
    ports:
      - '4321:4321'
    depends_on:
      db:
        condition: service_healthy

volumes:
  acoes_pgdata:
