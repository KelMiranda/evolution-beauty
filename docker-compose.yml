services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acoes_local
      POSTGRES_USER: CHANGE_ME
      POSTGRES_PASSWORD: CHANGE_ME
    ports:
      - '5437:5432'
    volumes:
      - acoes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      args:
        VITE_TURNSTILE_SITEKEY: ${VITE_TURNSTILE_SITEKEY:-}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://CHANGE_ME:CHANGE_ME@db:5432/acoes_local
      NODE_ENV: production
      COOKIE_SECURE: 'false'
      PORT: 4321
      HOST: 0.0.0.0
      PUBLIC_SITE_URL: http://localhost:4321
      VITE_TURNSTILE_SITEKEY: ${VITE_TURNSTILE_SITEKEY:-}
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: CHANGE_ME
    ports:
      - '4321:4321'
    depends_on:
      db:
        condition: service_healthy

volumes:
  acoes_pgdata:
